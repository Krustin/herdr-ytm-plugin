# tmux config for JLoPlaya's private player server only (tmux -L jloplaya).
# It never touches your own tmux. Goal: invisible apart from ytm itself.
# Override by copying to "$(herdr plugin config-dir jloplaya)/tmux.conf".

set -g status off                 # no status bar
set -g prefix None                # no prefix: every key goes to ytm ...
set -g prefix2 None
unbind-key -a -T prefix           # ... no tmux bindings at all (also no
unbind-key -a -T root             # right-click menus that split/kill panes),
bind-key -n C-d detach-client     # except one: ctrl+d hides the float
                                  # (free in ytm, easy on any layout).
set -g mouse on                   # Mouse goes straight through to ytm:
bind-key -n MouseDown1Pane send-keys -M
bind-key -n MouseDown3Pane send-keys -M
bind-key -n MouseDrag1Pane send-keys -M
bind-key -n MouseDragEnd1Pane send-keys -M
bind-key -n WheelUpPane   send-keys -M
bind-key -n WheelDownPane send-keys -M
set -g escape-time 0              # ytm uses Esc; no delay
set -g default-terminal "tmux-256color"
set -g set-titles off
set -g exit-empty on              # ytm quit -> session ends -> server exits
set -g destroy-unattached off     # hidden float keeps playing
